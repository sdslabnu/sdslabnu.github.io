- date: <b>March - May 2026</b>
  summary: ""
  headline: "<a href='https://sdslab.io/'>SDS Lab</a> PhD student Aayushi Mishra, working on climate finance and currently interning at the <strong>Municipal Market Analytics</strong>, Inc. (MMA) as a Research Fellow, received the <a href='https://coe.northeastern.edu/news/interdisciplinary-engineering-student-receives-2026-outstanding-phd-student-award-in-experiential-learning/''>2026 Outstanding PhD Student Award in Experiential Learning</a> from Northeastern University (NU) and was recognized as among the <strong>CERAWeek NextGen</strong> cohort of S&P Global. SDS Lab PhD student Diyali Goswami (see her <a href='https://arxiv.org/abs/2605.30592'>new paper on arXiv</a>), working on AI and physics-AI systems for weather, water, and earth systems, and currently interning at Amazon AI, received a <a href='https://coe.northeastern.edu/news/sds-lab-phd-student-wins-google-tpu-research-cloud-award-for-ai-weather-prediction/'>TPU grant</a> from Google (<strong>Google Inc. and Google dot Org</strong>). SDS Lab MS student Nihar Sanda received 2026 <a href='https://www.khoury.northeastern.edu/meet-the-2026-khoury-college-award-winners/'>Master’s Research Award</a> from NU Khoury College of Computer Science, was selected to the <a href='https://news.northeastern.edu/2026/04/15/laurel-and-scroll-100-2026-inductees/'>NU Laurel and Scroll 100</a>, while MS student Paing Hein Soe received the 2026 NU Civil and Environmental Engineering <a href='https://www.instagram.com/p/DXFMJBmjmim/'>MS Research Award</a>. Former <a href='https://ai.northeastern.edu/ai-climate'>AI4CaS</a> postdoc (and prior to that, an SDS Lab PhD student) Puja Das has accepted a new <a href='https://www.howlandlab.com/people'>postdoc position</a> with MIT CEE. A paper on hydrology, hydroclimate, and water diplomacy, authored jointly by the NU SDS Lab and Tufts University, and led by Puja Das, was <a href='https://agupubs.onlinelibrary.wiley.com/doi/full/10.1029/2025WR042679'>published</a> in the <strong>AGU</strong> journal <strong>Water Resources Research</strong>. A paper on knowledge graphs, graph-of-thoughts, and hypothesis generation with language models led by former SDS Lab MS student Nihar Sanda (currently at the NU Institute for Experience AI) has been accepted at <a href='https://www.iscb.org/ismb2026/home'>ISMB 2026</a>, the peer-reviewed conference of the <strong>International Society for Computational Biology</strong>. PI Auroop Ganguly is the coauthor of <a href='https://iopscience.iop.org/article/10.1088/2634-4505/ae63f2'>perspective article</a> in the journal <strong>Environmental Research: Infrastructure and Sustainability</strong> on physical systems and governance frameworks for urban sustainability, and of an accepted article on Atlantic tropical cyclones in the <strong>ASA</strong> journal <strong>Data Science in Science</strong>. Current and former SDS Lab and AI4CaS team members, along with US DOE’s PNNL and UC, Berkeley, <a href='https://www.nature.com/articles/s44333-026-00100-9'>published a paper</a> in the <strong>Nature partner</strong> journal <strong>npj | sustainable mobility and computing</strong>, on resilience of urban metro rail networks with data from 45 metro rail systems around the world. AI4CaS Postdoc Dongqin Zhou led an <strong>invention disclosure</strong> for possible patenting, jointly with NU and PNNL, on network-level threat deterrence in soft targets. A poster presentation by PhD student Jack Watson (currently CEO and Co-Founder of the new SDS Lab startup <a href='https://enodia.ai/'>Enodia</a>), Dongqin Zhou, and Auroop Ganguly, at the <a href='file:///Users/bhoomika/Downloads/serdp-estcp.mil/newsitems/details/dee7ff0f-667c-4970-8bc0-21c23910bf2b/update-about-the-dow-applied-innovation-workshop-now-in-march'>2026 DOD Innovation Workshop</a>, marked the end of the ~$3M, 5-year <a href='https://serdp-estcp.mil/projects/details/4fac77f3-2966-49c4-b3b5-a91593cec6a2/rc20-1183-project-overview'>DOD SERDP NICE</a> project led by Ganguly, involving NU, UC, Berkeley, PNNL, Army Corps, and DOD’s NRL. A <a href='https://www.youtube.com/watch?v=cG3-Ks-abfA'>webinar presentation</a>, by the private company Kitware, the AI4CaS Data Scientist August Posch, and Ganguly, was recorded to mark the conclusion of the <strong>DOE SBIR</strong> funded UVDAT project on simulating, visualizing, and analyzing risks of weather and hydrologic extremes to urban environment and infrastructures. Startups led by former SDS Lab PhD students (involving PI Ganguly) were in the news, following the tradition of <a href='https://news.northeastern.edu/2022/01/21/startup-guage-climate-change-risk/'>risQ</a> (founded by Evan Kodra and co-founded by Ganguly: see here for post-acquisition legacy) and <a href='https://myzeus.ai/'>Zeus AI</a> (founded by TJ Vandal and Kate Duffy, and advised by Ganguly and Kodra). The startup <a href='https://home.airesqclimsols.com/'>AIResQ</a> in India, led by former SDS Lab PhD student <a href='https://iitgn.ac.in/faculty/civil/fac-udit'>Udit Bhatia</a> (and co-founded by Ganguly) formerly highlighted for showcasing their work on urban flood prediction and consequences for human mobility with physics and AI methods at the <strong>India AI Impacts Summit 2026</strong> in New Delhi, India, has now been selected for the <strong>2026 Bharat Innovates</strong> (<a href='https://bharatinnovates.in/academia/iit-gandhinagar'>AI powered urban flood resilience solutions</a>) presentations in Nice, France. A new startup tentatively called AIResQ USA, co-founded by Bhatia and Ganguly, along with industry veteran Girish Pathak as the CEO, and involving SDS Lab UG and MS student Diane Grant, is being discussed with the <strong>City of Boston</strong>. Finally, the NU SDS Lab PI and director of NU <a href='https://ai.northeastern.edu/ai-climate'>AI4CaS</a>, <a href='https://coe.northeastern.edu/people/ganguly-auroop/'>Auroop Ganguly</a>, was quoted in articles in <a href='https://time.com/article/2026/04/01/water-desalination-plants-iran-war/'>Time Magazine</a>, <a href='https://www.livescience.com/planet-earth/war-has-brought-irans-water-crisis-to-a-breaking-point-things-will-collapse-unless-there-is-meaningful-structural-change'>Live Science</a>, and the <a href='https://news.northeastern.edu/2026/03/11/iran-war-water-crisis/'>NGN</a> on war and water infrastructure, as well as in the <a href='https://www.msn.com/en-us/weather/topstories/are-we-ready-for-the-era-of-category-6-hurricanes/ar-AA1Z2BhG'>MSN Climate Compass</a> on hurricanes. He <a href='https://podcastaddict.com/what-ai-means/episode/218166007'>delivered a podcast</a> organized by <strong>Amherst College</strong> and presented invited talks on AI for Sustainability, Climate, and the Environment at the <a href='https://indiaspora.org/events/climate-summit-2026/'>2026 Indiaspora Summit</a> (recording <a href='https://www.youtube.com/watch?v=TuNLD4VKkqM'>here</a>), <strong>U. Virginia</strong> (<a href='https://environment.virginia.edu/event/53%2C%2C/ai-environment-workshop'>AI + Environment</a>), the <strong>U. Notre Dame</strong> (<a href='https://architecture.nd.edu/events/2026/04/10/data-and-ai-for-sustainability-lecture-a-chaotic-confluence-with-auroop-r-ganguly/'>Data and AI for Sustainability</a>), <strong>Texas A&M Kingville, ETS Montreal, NU Oakland</strong> (see <a href='https://sustainability.northeastern.edu/innovationweek/schedule/'>here</a>), and <strong>Technion</strong> (virtual presentation to a visiting delegation at NU), attended an invited panel (in the broad topic of using AI to address critical gaps in the Environmental Performance Index) at <strong>Yale University</strong> in New Haven, CT, and presented the prestigious <a href='https://www.umass.edu/honors/honors-events/daffodil-lecture'>2026 Daffodil Lecture</a> organized by the Honors College at the <strong>University of Massachusetts at Amherst</strong>. Ganguly's duties over the last few months include serving as an Area Chair for the Research Track of ACM KDD 2026, a reviewer for NeurIPS 2026, a reviewer for journals from the Nature Publishing Group, and the Chief Editor for the Water and Built Environment specialty of Frontiers in Water."
  
- date: <b>February 2026</b>
  summary: ""
  headline: "The SDS Lab and <a href='https://ai.northeastern.edu/ai-climate'>AI4CaS</a>, jointly with collaborators from Berkeley and PNNL, had a paper accepted for publication in <a href='https://www.nature.com/npjsustainmobil/'>npj Sustainable Mobility and Transport</a>. The authors were MS student Orijeet Mukherjee, postdoctoral associate Dongqin Zhou, the original contributor Ashis Pal (MS alumnus), recently graduated PhD student Jack Watson, and PI Ganguly.  Two PNNL-led papers were published in <a href='https://onlinelibrary.wiley.com/doi/10.1111/risa.70197'>Risk Analysis</a> and <a href='https://ieeexplore.ieee.org/document/11402883'>IEEE</a> Transactions jointly with PI Ganguly. Aayushi Mishra, a PhD candidate and the inaugural Lizzy Warner Fellow at the SDS Lab, recently discussed urban climate risks on an invited episode of the <a href='https://podcasts.apple.com/us/podcast/the-muni-lowdown/id1546260774'>Muni Lowdown podcast</a>. Her research in <a href='https://www.nature.com/articles/s44284-025-00365-0'>Nature Cities</a>, previously featured in the <a href='https://www.wsj.com/business/energy-oil/eight-big-climate-and-energy-questions-for-2026-593e2e7a'>Wall Street Journal</a> and <a href='https://news.northeastern.edu/2026/01/06/climate-debt-doom-loop/'>Northeastern Global News</a>, was presented to state officials in California (including Caltrans) and Washington, as well as at the Center for Climate Studies of the Indian Institute of Technology Bombay. These presentations were based on her joint work with <a href='https://www.wsj.com/finance/investing/high-tech-weathermen-forecast-climate-risks-for-bond-markets-11657461236'>Evan Kodra</a>, a PhD alumnus of the SDS Lab and founder of the climate-risk startup <a href='https://coe.northeastern.edu/news/risq-acquired-by-intercontinental-exchange/'>risQ</a>. Puja Das, a recent PhD graduate from the SDS Lab and current postdoc at AI4CaS, has accepted a position at the Massachusetts Institute of Technology. August Posch, a data scientist at the AI4CaS group, is joining <a href='https://myzeus.ai/'>Zeus AI</a>, a weather-AI technology startup co-founded by SDS Lab PhD alumni <a href='https://news.northeastern.edu/2023/05/18/ai-weather-predictions/'>TJ Vandal and Kate Duffy</a>, as the CEO and CSO respectively. Our startup Zeus AI recently hired not only from the SDS Lab and AI4CaS, but also from other educational institutions, such as Harvard University.  AI4CaS postdoctoral researchers Dongqin Zhou and Puja Das were inducted into the <a href='https://www.asce.org/communities/institutes-and-technical-groups/changing-climate/committees/cacc-executive-committee/technical-committee-on-future-weather-and-climate-extreme'>ASCE Technical Committee on Adaptation to Climate Change</a>. MS student Nihar Sanda led a new invention combining knowledge graphs and language models, resulting in a provisional patent submission. <a href='https://airesqclimsols.com/'>AIResQ</a>, a physics-AI based startup focused on flood prediction and transportation resilience, was founded by SDS Lab PhD alumnus (and IIT professor) <a href='https://iitgn.ac.in/faculty/civil/fac-udit'>Udit Bhatia</a> in India and co-founded by PI Ganguly. The company made a splash at the 2026 <a href='https://impact.indiaai.gov.in/'>AI Impact Summit</a> in India and its <a href='https://www.pib.gov.in/PressReleasePage.aspx?PRID=2223844&reg=3&lang=2'>ARC center</a> was highlighted by the Government of India. The SDS Lab and AI4CaS organized two fireside chats: one with <a href='https://www.spglobal.com/sustainable1/en/who-we-are/our-people/tim-hall#q=&rows=20&pagenum=1'>Timothy Hall</a> of <strong>S&P Global</strong> and another with <a href='https://www.linkedin.com/in/daiwei-wang-7aa15523/'>Daiwei (David) Wang</a>, a postdoc alumnus from the SDS Lab, of <strong>Verisk Cat Modeling</strong>. PI Ganguly, who directs both the SDS Lab and the AI4CaS group, was recently featured on an invited podcast titled “<a href='https://www.liberal-arts.ai/podcast-episode-what-ai-means-for-sustainability/'>What AI means for Sustainability</a>“, as reported in the <a href='https://coe.northeastern.edu/news/sds-lab-and-ai4cas-drive-global-climate-policy-impact/'>Northeastern College of Engineering News</a>."

- date: <b>January 2026 </b>
  summary: "Recent SDS Lab and AI4CaS work includes high-impact publications (Nature Cities, npj Climate and Atmospheric Science), major media coverage, invited talks, new patents, and growing climate-AI startups driven by students and alumni. Together, these efforts showcase the lab’s leadership at the intersection of climate science, infrastructure resilience, and data-driven innovation."
  headline: "Over the last 5 months, the <a href='https://sdslab.io/'>SDS Lab</a> and <a href='https://ai.northeastern.edu/ai-climate'>AI4CaS</a> have led a <a href='https://www.nature.com/articles/s44284-025-00365-0'>review paper</a> in <strong>Nature Cities</strong> (led by current PhD student Aayushi Mishra and co-led by former PhD student and <a href='https://www.wsj.com/finance/investing/high-tech-weathermen-forecast-climate-risks-for-bond-markets-11657461236'>successful</a> climate <a href='https://news.northeastern.edu/2022/01/21/startup-guage-climate-change-risk/'>entrepreneur</a> Evan Kodra) on infrastructure funding and weather extremes and a <a href='https://www.nature.com/articles/s41612-025-01208-4'>perspective article</a> in <strong>npj Climate and Atmospheric Science</strong> on nonlinear dynamics for irreducible uncertainty (led by postdoctoral associate Rachindra Mawalagedara with SDS Lab and AI4CaS team members Arnob Ray, Puja Das, Jack Watson, and Ashis Pal, as well as former PhD students Kate Duffy and Udit Bhatia), besides contributing to an ecological conservation <a href='https://www.nature.com/articles/s43247-025-02924-8'>research paper</a> with network science and modeling in <strong>Communications Earth and Environment</strong> and a network science-based disease spreading <a href='https://onlinelibrary.wiley.com/doi/full/10.1111/mice.70165'>research article</a> in <strong>Computer-Aided Civil and Infrastructure Engineering</strong>. Furthermore, our work has been <a href='https://www.wsj.com/business/energy-oil/eight-big-climate-and-energy-questions-for-2026-593e2e7a'>cited</a> by the <strong>Wall Street Journal</strong> and <a href='https://www.nature.com/articles/d44151-025-00240-w'>quoted</a> in <strong>Nature India</strong>, and we have presented invited talks at the annual meetings of the <strong>American Geophysical Union</strong>, a student group at <strong>Harvard University</strong>, and had wide ranging discussions with the states of Massachusetts, Washington, and California, led by PhD students Aayushi Mishra and Jack Watson, along with Evan Kodra. The annual meeting of the <strong>American Meteorological Society</strong> featured our tributes to Prof. Rafael Bras, in the form of a <a href='https://www.wsj.com/business/energy-oil/eight-big-climate-and-energy-questions-for-2026-593e2e7a'>formal talk</a> and an <a href='https://www.youtube.com/watch?v=YE3LvJckI2Q'>informal presentation</a> by the PI Ganguly. The tributes included posters led by Puja Das, Shuochen Wang (with former PhD student Nishant Yadav, now at Microsoft AI), and Aayushi Mishra, which were presented by key contributor and student leader at the SDS Lab, Jack Watson, who in turn defended his PhD dissertation successfully in December 2025. A new US provisional patent was filed on knowledge graphs, led by MS student Nihar Sanda, while a <a href='https://nu.technologypublisher.com/technology/58003'>previous provisional patent</a> led by PhD student Jack Watson on infrastructure resilience was <a href='https://patents.google.com/patent/US20250265376A1/en'>formally filed</a> with the US patent office. The three startups led by former SDS Lab PhD students, <a href='https://myzeus.ai/'>Zeus AI</a> (Weather and AI: based in greater Boston, MA), <a href='https://airesqclimsols.com/'>AIResQ</a> (Flood Resilience and Physics-AI: based in Gujarat, India), and even the very new <a href='https://enodia.ai/'>Enodia</a> (Infrastructure Resilience: based in greater Boston, MA, and Portland, Maine) – all following to various extents in the footsteps of <a href='https://news.northeastern.edu/2022/01/21/startup-guage-climate-change-risk/'>risQ</a> – have had a spate of successes. The <a href='https://coe.northeastern.edu/people/ganguly-auroop/'>PI Ganguly</a> delivered invited talks at the Nature Conservancy (a nonprofit), the Toronto Metropolitan University, the Georgia Institute of Technology, the <a href='https://www.youtube.com/watch?v=6jLI29ISYdA'>Kyung Hee University</a> in South Korea (repeated with slight variation at Harvard University), and Northeastern University (<a href='https://www.youtube.com/watch?v=zmPRa2_URmU'>AI for CEE</a>), and a keynote address at the 2025 Sustainability Hackathon of the Amherst College. Furthermore, Ganguly was named as one of five Indian diaspora scientists driving global change in an <a href='https://mediaindia.eu/diaspora/indian-diaspora-scientists-driving-global-change/'>article</a> by the <strong>Media India Group</strong>."

- date: <b>August 2025</b>
  summary: "npj and Physical Review E publications; Science, Medium, Manila Times quotes; Harvard, KDD Fragile Earth, Toronto talks; Air Force WEAVE funding; Congressional testimony; lab startups (ICE, Zeus AI, AIResQ, Enodia) and ongoing grants. This news captures a sustained period of high-profile scholarship, visibility, funding, and entrepreneurship across the lab’s climate and complexity portfolio."
  headline: "Over the last six months, the <a href='https://sdslab.io/'>SDS Lab</a> researchers have published in Nature Partner Journals (npj), specifically, <a href='https://www.nature.com/articles/s44260-025-00048-w'>npj Complexity</a> (on network science as a tool for delineation of large ensemble of earth system models) and <a href='https://www.nature.com/articles/s41612-025-01134-5'>npj Climate and Atmospheric Science</a> (on evaluation and uncertainty of earth system multimodel ensembles), as well as in <a href='https://journals.aps.org/pre/abstract/10.1103/q7f4-fcf8'>Physical Review E</a> (a nonlinear physics journal on a new methods for resampling based causal analysis), a (a workshop summary) in the <a href='https://dl.acm.org/doi/abs/10.1145/3711896.3737864'>Association for Computing Machinery (ACM) SIGKDD Proceedings</a> (an AI and the top data mining conference), and a review paper on nonlinear dynamics methods for complexity in the earth sciences in an npj journal (just accepted). The <a href='https://sdslab.io/'>SDS Lab</a> PI (Ganguly: <a href='https://coe.northeastern.edu/people/ganguly-auroop/'>NU</a>, <a href='https://www.pnnl.gov/people/auroop-ganguly'>PNNL</a>, <a href='https://en.wikipedia.org/wiki/Auroop_Ratan_Ganguly'>Wikipedia</a>) has been quoted in an editorial news article of <a href='https://www.science.org/content/article/local-predictions-climate-change-are-hazy-cities-need-answers-fast'>Science magazine</a> (on urban climate projections), in <a href='https://medium.com/the-new-climate/850-million-reasons-to-take-climate-and-water-models-seriously-cfcaebf822ff'>Medium</a> (on systematic evaluation of earth system models) and in an editorial in the <a href='https://www.msn.com/en-ph/news/opinion/global-weirding-triggering-bizarre-weather-patterns/ar-AA1ARqUL'>Manila Times</a> (on global weirding: see also, for context, <a href='https://www.newsweek.com/climate-change-causing-climate-chaos-weather-extreme-events-1739426'>here</a>, <a href='https://www.nytimes.com/2022/10/03/climate/hurricane-ian-rebuilding.html'>there</a>, and <a href='https://www.nytimes.com/2022/09/29/climate/coastal-hospitals-hurricane-flooding.html'>yonder</a>), delivered invited talks at <a href='https://ds.dfci.harvard.edu/event/2025-marvin-zelen-memorial-symposium/'>Harvard University</a> (on <a href='https://zelen25.my.canva.site/'>data-driven controversies</a>), the <a href='https://ai4good.org/fragile-earth-2025/'>KDD 2025 Fragile Earth Workshop</a> (on physics-integrated AI for the earth sciences), and the <a href='https://tpl.webex.com/tpl/ldr.php?RCID=0067a668c46fa868657c52fd9d89f21c'>Toronto Public Library</a> (on AI for climate; key: mYUsaM2i), as well as interviews on an <a href='https://www.youtube.com/watch?v=2fJfBDTqh6c'>Agents of Tech WebsEdge Podcast</a> (on the potential and pitfalls of AI) and <a href='https://www.youtube.com/watch?v=Tz-pxh4gDXI'>Radio Polar</a> in Magallanes Chile (regarding our study-abroad program: climate, weather, and emerging economies). Meanwhile, the AI4CaS focus area of the Institute for Experiential AI and the Roux Institute, along with the SDS Lab, received a new ~$1 Million funding from the <a href='https://coe.northeastern.edu/news/advancing-weather-prediction-for-defense-applications/'>Air Force Weather</a> (WEAVE: Weather Ensemble Analysis and Visualization Environment) while continuing on existing funded projects such as the 5-year, ~$3M <a href='https://dodnice.github.io/workshop_2/'>DOD SERDP</a> (NICE: Networks Infrastructure under Compound Extremes), NASA Water Resources (RAIN: Remote-sensing data driven Artificial Intelligence based precipitation-Nowcasting), two Small Business Innovation Research (SBIR) projects funded by the US DOE, a project funded by the Indian Monsoon Mission, research funded by the government of Indonesia, and a donor-funded research. The work by the SDS Lab also informed a <a href='https://coe.northeastern.edu/news/sds-lab-research-featured-at-congressional-testimony/'>US Congressional testimony</a> related to the 10-year, ~$36 Million center on soft target threat deterrence. The four startups launched by former SDS Lab PhD students are all thriving: the former startup <a href='https://news.northeastern.edu/2022/01/21/startup-guage-climate-change-risk/'>risQ</a> (also, see <a href='https://www.wsj.com/finance/investing/high-tech-weathermen-forecast-climate-risks-for-bond-markets-11657461236'>here</a>) currently as <a href='https://www.ice.com/fixed-income-data-services/ice-climate-data-analytics'>ICE Climate</a> (where this ICE stands for Intercontinental Exchange, the Fortune 500 company that owns the New York Stock Exchange) post their successful acquisition, the current startup <a href='https://myzeus.ai/'>Zeus AI</a> (on weather and AI: for context, see <a href='https://news.northeastern.edu/2023/05/18/ai-weather-predictions/'>here</a>) that has been thriving over the last few years, and two recent startups (which received new funding recently): <a href='https://airesqclimsols.com/'>AIResQ</a> (on AI based flood prediction and resilience) and <a href='https://cri.northeastern.edu/strengthening-infrastructure-resilience-spark-fund-awards-jack-watson-for-infra-dst/'>Enodia</a> (on infrastructure resilience, partly based on a pending US patent by the SDS Lab, which is our third submission following two previous successful US patents). The PI was invited to give multiple talks at various reputed universities in the US, Chile, Argentina and India. He gave invited talks (or recently got invited for them) at workshops or sessions of the American Society for Civil Engineers, American Geophysical Union, and the American Meteorological Society. He also served as Area Chairs, and/or Program and/or Laureate Selection Committee Members, for top AI and ML conferences such as ACM KDD, AAAI, AISTATS and ACML, as well as in journal multiple editorial boards." 

- date: <b>May 2025</b>
  summary: "Faculty-led study-abroad program in Chile and Argentina (May–June 2025). The dialogue emphasized climate, resilience, and experiential learning across contrasting South American environments."
  headline: "The SDS Lab PI <a href='https://en.wikipedia.org/wiki/Auroop_Ratan_Ganguly'>Ganguly</a> ran a very successful and highly-rated, month-long, faculty-led, <a href='https://coe.northeastern.edu/news/dialogue-of-the-decade-the-climate-of-chile-and-argentina-in-may-june-2025/'>study-abroad program in Chile and Argentina</a> from May to June in 2025."

- date: <b>February 2025</b>
  summary: "Lab highlights: hybrid physics-AI nowcasting (UN/COP29), Enodia and AIresQ startups, media citations, $70M+ funding, PI Distinguished Member ACM. Collectively, these accomplishments underscore the lab’s impact from fundamental research to policy, practice, and commercialization."
  headline: "Over the past twenty months, the <a href='https://sdslab.io/'>SDS Lab</a> has been highly active in research, publications, and collaborations. A key highlight includes the dissertation research in hybrid physics-AI for precipitation nowcasting by senior PhD student <a href='https://www.linkedin.com/in/puja-das-2a939b12b/'>Puja Das</a>, published in a Nature partner journal and featured by the <a href='https://sustainability-coalition.org/wp-content/uploads/2024/06/Accelerating-Implementation-of-DRR-and-Resilience-in-Infrastructure.pdf'>United Nations Disaster Risk Reduction</a> and <a href='https://sustainability-coalition.org/wp-content/uploads/2024/11/CRI3_A-Focus-on-Technology.pdf'>COP29</a>. Research in national and homeland security by PhD student <a href='https://www.linkedin.com/in/jack-watson-5b9917139/'>Jack Watson</a> has led to merit recognitions, a pending US patent on facility and lifeline resilience, and the launch of a startup, <a href='https://www.enodia.ai/'>Enodia</a>. Former SDS Lab PhD student <a href='https://www.linkedin.com/in/udit-bhatia/'>Udit Bhatia</a> launched <a href='https://www.airesq.com/'>AIresQ</a> for AI-based flood prediction, and the lab continues its involvement in startups such as <a href='https://www.intercontinentalexchange.com/'>risQ</a> (now part of ICE) and <a href='https://myzeus.ai/'>Zeus AI</a>. PI <a href='https://coe.northeastern.edu/people/ganguly-auroop/'>Auroop Ganguly</a> is an advisor or co-founder in all four startups. The SDS Lab's work has been cited in <em>Bloomberg</em>, <em>Forbes</em>, <em>Newsweek</em>, and <em>Politifact</em>, with publications in <em>Nature Research</em> and <em>PNAS Nexus</em>. The lab has secured over $70M in external funding, and Prof. Ganguly received two new recognitions, including his elevation to a Distinguished Member of the ACM. Further details are available upon request (please contact either the <a href='https://coe.northeastern.edu/people/ganguly-auroop/'>SDS Lab PI Auroop Ganguly</a>, or for expedited requests, the <a href='mailto:s.arrieta@northeastern.edu'>Executive Assistant Santiago Arrieta</a> or the <a href='mailto:ro.anderson@northeastern.edu'>technical program and business development manager Robyn Anderson</a>)."

- date: <b>June 2023</b>
  summary: "Kate Duffy wins Clemens Herschel Award for Nature Climate Change climate-ecology article; featured in Northeastern, PNNL, NASA, international media. The recognition highlights the scientific and societal relevance of the lab’s work on climate impacts to ecosystems."
  headline: "SDS Lab alumna <a href='https://www.linkedin.com/in/katemduffy/' target='_blank'>Kate Duffy</a> (PhD '2021) wins the 2022 <a href='https://www.bsces.org/recognition/professionals/clemens-herschel-award-112' target='_blank'>Clemens Herschel Award</a> from the <a href='https://www.bsces.org/about' target='_blank'>Boston Society of Civil Engineers Section</a> for a <a href='https://www.nature.com/articles/s41558-022-01490-7' target='_blank'>climate-ecology Article</a> that she authored with the SDS Lab PI <a href='https://coe.northeastern.edu/people/ganguly-auroop/' target='_blank'>Auroop Ganguly</a> and long-time collaborator <a href='https://cos.northeastern.edu/people/tarik-gouhier-3/' target='_blank'>Tarik Gouhier</a>. The article along with an accompanying <a href='https://www.nature.com/articles/s41558-022-01494-3' target='_blank'>Research Briefing</a>, published in the <a href='https://www.nature.com/nclimate/volumes/12/issues/11' target='_blank'>November issue</a> of the journal <a href='https://www.nature.com/nclimate/' target='_blank'>Nature Climate Change</a>, and has been highlighted by <a href='https://news.northeastern.edu/2022/10/31/insects-climate-change/' target='_blank'>Northeastern News</a>, <a href='https://www.pnnl.gov/publications/simulating-effects-climate-change' target='_blank'>PNNL Spotlight</a>, and <a href='https://www.nasa.gov/feature/climate-change-can-put-more-insects-at-risk-for-extinction-0/' target='_blank'>NASA Feature</a>, as well as by the international media such as in <a href='https://www.ndtv.com/world-news/climate-change-could-move-65-of-insect-population-towards-extinction-3517911' target='_blank'>India</a> and the <a href='https://www.yourweather.co.uk/news/science/insects-in-peril-climate-change-extinction-risk-wildlife-endangered-species.html' target='_blank'>United Kingdom</a>."

- date: <b>May 2023</b>
  summary: "SDS Lab at UN UNDRR event on disaster risk reduction; Biogeosciences paper; Zeus AI NASA SBIR Phase II; BAPPENAS Indonesia delegation visit. This reflects the lab’s growing role in informing global policy dialogues, advancing earth system research, and translating AI into operational tools."
  headline: "The <a href='https://sdslab.io/'>SDS Lab</a> visits the <strong>United Nations</strong> headquarters in New York City for an invitation-only <a href='https://www.undrr.org/news/daily-report-17-may-2023-high-level-meeting-midterm-review-sendai-framework'>event</a> organized by the <a href='https://www.undrr.org/'>UNDRR</a> (United Nations Office of Disaster Risk Reduction) which was attended by US academia, government, and the private sector, as well as international partners from around the globe. As reported by a Northeastern <a href='https://news.northeastern.edu/2023/05/25/reduce-climate-change-disasters/'>news article</a> (and a <a href='https://coe.northeastern.edu/news-events/news/faculty-related-news/?facid=59'>COE article</a>), besides a <a href='https://www.youtube.com/shorts/mq70FSBiQDI'>short opening statement</a> by SDS Lab PI <a href='https://coe.northeastern.edu/people/ganguly-auroop/'>Auroop Ganguly</a>, the event included a statement on <em>hybrid physics-AI</em> and <em>Big Data &ndash; small data challenges</em> for <strong><em>disaster risk reduction</em></strong> and <strong><em>climate resilience</em> </strong>by Ganguly (excerpt <a href='https://www.youtube.com/watch?v=vzLLGBu1UIE&amp;ab_channel=SDSLab-NortheasternU.'>here</a>) and a case study <a href='https://www.youtube.com/watch?v=2f0kxUYxbG4&amp;ab_channel=SDSLab-NortheasternU.'>presentation</a> by SDS Lab PhD candidate <a href='https://www.linkedin.com/in/puja-das-2a939b12b/'>Puja Das</a>. A third white paper on SDS Lab&rsquo;s translation research (e.g., US patents and startups) was submitted but not presented. In addition to Das and Ganguly, the SDS Lab participants included incoming and current PhD students <a href='https://twitter.com/aayushikmishra'>Aayushi Mishra</a> and <a href='mailto:indrawati.d@northeastern.edu'>Dian Indrawati</a> (co-author of the case study paper with Das), PhD candidates <a href='https://www.linkedin.com/in/jack-watson-5b9917139/'>Jack Watson</a> and <a href='https://www.linkedin.com/in/ashis-pal-ipe/'>Ashis Pal</a>, Postdoc <a href='https://www.linkedin.com/in/rishi-sahastrabuddhe-6485b892/?originalSubdomain=in'>Rishi Sahastrabuddhe</a>, <a href='https://ai.northeastern.edu/'>EAI</a> Postdoc <a href='https://www.linkedin.com/in/arnob-ray-63284622a/?originalSubdomain=in'>Arnob Ray</a> and <a href='https://globalresilience.northeastern.edu/'>GRI</a> Postdoc <a href='https://coe.northeastern.edu/people/mawalagedara-rachindra/'>Rachindra Mawalagedara</a> (author of the translational research paper with Watson). The nine-member SDS Lab contingent represented five countries: Bangladesh, India, Indonesia, Sri Lanka, and the United States of America. Recent SDS Lab PhD alumnus <a href= 'https://www.ornl.gov/staff-profile/bharat-d-sharma '>Bharat Sharma</a> publishes a <a href= 'https://doi.org/10.5194/bg-20-1829-2023 '>paper</a> in the journal <strong><em>Biogeosciences</em></strong> titled <em>&ldquo;Carbon cycle extremes accelerate weakening of the land carbon sink in the late 21st century&rdquo;</em>. Besides SDS Lab PI <a href= 'https://en.wikipedia.org/wiki/Auroop_Ratan_Ganguly '>Auroop Ganguly</a>, the co-authors include long-term SDS Lab collaborators from the US Department of Energy&rsquo;s Oak Ridge National Laboratory (ORNL): <a href= 'https://www.ornl.gov/staff-profile/jitendra-kumar '>Jitendra Kumar</a> and <a href= 'https://www.ornl.gov/staff-profile/forrest-m-hoffman '>Forrest Hoffman</a>. SDS Lab PhD alums <a href= 'https://www.linkedin.com/in/katemduffy/ '>Kate Duffy</a> (PhD '2021) and <a href= 'https://www.linkedin.com/in/tjvandal/ '>Thomas Vandal</a> (PhD '2018) lead <a href= 'https://myzeus.ai/ '>Zeus AI</a>, the startup they co-founded for AI-based weather prediction with satellite data for the renewable energy sector, to Phase II grant funding from <strong>NASA SBIR</strong>, as reported by a Northeastern <a href= 'https://coe.northeastern.edu/news/how-ai-is-making-weather-forecasts-more-accurate/ '>news article</a>. SDS Lab alumnus <a href= 'https://www.linkedin.com/in/evan-kodra-43bb0023/ '>Evan Kodra</a> (PhD '2014), a successful entrepreneur in <a href= 'https://news.northeastern.edu/2022/01/21/startup-guage-climate-change-risk/ '>urban climate</a> and <a href= 'https://www.wsj.com/articles/high-tech-weathermen-forecast-climate-risks-for-bond-markets-11657461236 '>muni bonds</a>, as well as SDS Lab PI <a href= 'https://en.wikipedia.org/wiki/Auroop_Ratan_Ganguly '>Auroop Ganguly</a>, are Zeus AI <a href= 'https://myzeus.ai/about.html '>advisors</a>. A delegation from the Indonesian ministry <a href=' https://www.bappenas.go.id/en' >BAPPENAS</a>, or the <a href=' https://en.wikipedia.org/wiki/Ministry_of_National_Development_Planning_(Indonesia)' >Ministry for National Development Planning</a> of Indonesia, visited the SDS Lab led by College of Engineering (COE) Distinguished Professor <a href=' https://coe.northeastern.edu/people/ganguly-auroop/' >Auroop Ganguly</a>, on May 1, 2023, to discuss potential long term collaborations and grant funding, as <a href=' https://coe.northeastern.edu/news/ministerial-delegation-from-the-government-of-indonesia-visits-the-sds-lab-at-northeastern/' >reported</a> by the Northeastern University (NU) College of Engineering (COE)."

- date: <b>April 2023</b>
  summary: "Indian Monsoon Mission Phase III project on extreme precipitation forecasts with climate networks and hybrid physics-ML, led by IIT Bombay with NU Co-PI. The collaboration strengthens international ties while advancing operational forecasting for climate extremes over India."
  headline: "The <a href='https://www.moes.gov.in/programmes/monsoon-mission-india?language_content_entity=en' > Monsoon Mission of India </a>, Phase III (<strong>MM-III</strong>), led by the Ministry of Earth Sciences (MoES) of India and co-led by the Indian Institute of Tropical Meteorology (IITM), Pune, among others, funds a project titled<em> ' Improving short-to-medium range extreme precipitation forecasts with climate networks and hybrid physics-ML convection parameterization' </em>. The project is led by the Indian Institute of Technology (IIT) Bombay, and includes IIT campuses in Gandhinagar (the corresponding Co-PI is SDS Lab alumnus <a href=' https://iitgn.ac.in/faculty/civil/fac-udit' > Udit Bhatia </a> ) and Madras, as well as the Indian Institute of Science Education and Research (IISER), Pune. The Co-PI from Northeastern University is SDS Lab PI <a href=' https://coe.northeastern.edu/people/ganguly-auroop/' > Auroop Ganguly </a> , with direct and possible indirect involvements by SDS Lab Postdocs   <a href=' https://www.linkedin.com/in/rishi-sahastrabuddhe-6485b892/?originalSubdomain=in' > Rishi Shastrabuddhe </a> and <a href='https://www.linkedin.com/in/arnob-ray-63284622a/?originalSubdomain=in' > Arnob Ray </a> ."

- date: <b>March 2023</b>
  summary: "DOE SBIR Phase I with Kitware for Urban Visualization and Data Analysis Toolkit (UVDAT). The project will help create interactive tools for understanding urban infrastructure, risk, and resilience."
  headline: "The SDS Lab wins a US <strong>DOE SBIR</strong> Phase I grant titled <em> 'Urban Visualization and Data Analysis Toolkit (UVDAT) '</em> with lead partner <a href= 'https://www.kitware.com/ '>Kitware</a>. Northeastern persons are <a href= 'https://coe.northeastern.edu/people/ganguly-auroop/ '>Auroop Ganguly</a> and <a href= 'https://www.linkedin.com/in/rishi-sahastrabuddhe-6485b892/?originalSubdomain=in'>Rishi Sahastrabuddhe</a>, SDS Lab PI and Postdoc respectively, with occasional support from SDS PhD candidates <a href= 'https://www.linkedin.com/in/jack-watson-5b9917139/'>Jack Watson</a> and <a href= 'https://www.linkedin.com/in/ashis-pal-ipe/'>Ashis Pal</a>."

- date: <b>January 2023</b>
  summary: "Kate Duffy and Ganguly publish explainable deep learning for El Niño and river flows in Nature Communications; Northeastern and PNNL spotlights. The study demonstrates how interpretable AI can uncover physical mechanisms linking large-scale climate patterns with regional hydrology."
  headline: "Recent SDS Lab PhD alumna <a href='https://www.linkedin.com/in/katemduffy/'>Kate Duffy</a> and her adviser SDS Lab PI <a href='https://coe.northeastern.edu/people/ganguly-auroop/'>Auroop Ganguly</a> (as corresponding author) <a href='https://www.nature.com/articles/s41467-023-35968-5'>published a paper</a> titled <em>Explainable deep learning for insights in El Ni&ntilde;o and river flows</em> in <strong><em>Nature Communications</em></strong> jointly with recent PhD alumnus Yumin Liu and his adviser Jennifer Dy from ECE. The paper, highlighted as a <a href='https://news.northeastern.edu/2023/02/17/el-nino-weather/'>news article</a> by Northeastern and as a <a href='https://www.pnnl.gov/publications/connecting-river-flows-and-el-nino-ai'>PNNL Spotlight</a>, partially contributed to <a href='https://www.lifewire.com/how-could-ai-help-combat-climate-change-lets-count-the-ways-7374806'>an article in Lifewire</a>."

- date: <b>November 2022</b>
  summary: "Ganguly delivers invited plenary at TIES 2022 and invited talk at SC22; lab welcomes three new postdocs. These engagements and new hires expand the lab’s reach in statistics, high-performance computing, and climate-resilient infrastructure."
  headline: "SDS Lab PI&nbsp;<a href='https://en.wikipedia.org/wiki/Auroop_Ratan_Ganguly'>Auroop Ganguly</a> delivers an&nbsp;<a href='https://www.youtube.com/watch?v=U6ty8gI66TA&ab_channel=EnvironmetricsWebinar'>invited plenary</a> at&nbsp;<a href='https://www.environmetrics.xyz/TIES2022'>TIES 2022</a> and an&nbsp;<a href='https://www.youtube.com/watch?v=IauXLDkaQAw&ab_channel=SCConferenceSeries'>invited talk</a> at&nbsp;<a href='https://sc22.supercomputing.org/'>SC22</a>, even as the Lab prepares to welcome three new postdoctoral research associates in climate, infrastructures, and data sciences, with PhDs from the University of Nebraska Lincoln, Brown University, and the Indian Statistical Institute."
  
- date: <b>October 2022</b>
  summary: "Kate Duffy's climate-ecology article and Research Briefing in Nature Climate Change; highlighted by Northeastern News, PNNL, and NASA."
  headline: "A <a href='https://www.nature.com/articles/s41558-022-01490-7'>climate-ecology Article</a> and an accompanying <a href='https://www.nature.com/articles/s41558-022-01494-3'>Research Briefing</a> by (recently graduated) SDS Lab PhD student <a href='https://www.linkedin.com/in/katemduffy/'>Kate Duffy</a> gets published in the <a href='https://www.nature.com/nclimate/volumes/12/issues/11'>November issue</a> of the journal <a href='https://www.nature.com/nclimate/'>Nature Climate Change</a>, and has been highlighted by <a href='https://news.northeastern.edu/2022/10/31/insects-climate-change/'>Northeastern News</a>, <a href='https://www.pnnl.gov/publications/simulating-effects-climate-change'>PNNL Spotlight</a>, and <a href='https://www.nasa.gov/feature/climate-change-can-put-more-insects-at-risk-for-extinction-0/'>NASA Feature</a>."
  
- date: <b>November 4th 2022</b>
  summary: "Jack Watson receives SRA Student Merit Award from Resilience Analysis Specialty Group for rail network resilience work."
  headline: "SDS Lab PhD student <a href='https://www.linkedin.com/in/jack-watson-5b9917139/'>Jack Watson</a> gets the Society for Risks Analysis (SRA) Student Merit Award from the <a href='https://www.sra.org/risk-analysis-specialty-groups/resilience-analysis/'>Resilience Analysis Specialty Group</a> second year in a row for work on resilience of multiscale rail networks under compound extremes, as part of a PNNL-Northeastern collaboration."  

- date: <b>October 2022</b>
  summary: "Ganguly quoted in NYT, Newsweek, National Geographic, BBC, Independent, Boston 25, Berkeley KPFA on hurricanes, heat, drought, and climate."
  headline: "SDS Lab PI <a href='https://en.wikipedia.org/wiki/Auroop_Ratan_Ganguly'>Auroop Ganguly</a>'s media quotes: the <b>New York Times</b> on <a href='https://www.nytimes.com/2022/10/03/climate/hurricane-ian-rebuilding.html'>building back better after hurricanes</a> and on <a href='https://www.nytimes.com/2022/09/29/climate/coastal-hospitals-hurricane-flooding.html'>hurricanes and hospitals</a>, <b>Newsweek</b> on <a href='https://www.newsweek.com/climate-change-causing-climate-chaos-weather-extreme-events-1739426'>global weirding and climate extremes</a>, the <a href='https://www.newsweek.com/california-heatwave-ongoing-this-week-electricity-shortages-blackouts-1739826'>2022 California heat waves</a>, <a href='https://www.newsweek.com/lake-mead-drought-exposes-creepy-long-lost-boat-loaded-artifacts-1728050'>drought impacts on Lake Mead</a>, and <a href='https://www.newsweek.com/north-carolina-lake-disappears-hundreds-fish-suffocate-death-1728238'>fish suffocation in North Carolina's Lake Wilson</a>, the <b>National Geographic</b> on the <a href='https://www.nationalgeographic.com/environment/article/is-building-more-dams-the-way-to-save-rivers'>role of dams</a>, the <b>BBC World Service</b> on <a href='https://www.youtube.com/watch?v=qZGTjBnpOYE'>Hurricane Ian</a> (12:30 - 13:15), the <b>Independent (UK)</b> on the <a href='https://www.independent.co.uk/climate-change/news/pakistan-floods-appeal-melting-glaciers-monsoon-b2157377.html'>2022 Pakistan floods</a>, <b>Boston 25 News</b> on <a href='https://www.boston25news.com/news/local/extreme-temperatures-demand-straining-electricity-system-massachusetts/4GOLFRREC5BTNPTZFY6B74B5EQ/'>heatwaves and the power grid</a>, and <b>Berkeley KPFA</b> on <a href='https://kpfa.org/player/?audio=387490'>hurricanes in Florida</a> (35:45 - 44:40)."

# - date: August/September 2022
#   headline: "SDS Lab PI <a href='https://en.wikipedia.org/wiki/Auroop_Ratan_Ganguly'>Auroop Ganguly</a> was quoted by major media outlets in August and September of 2022: the <b>New York Times</b> on <a href='https://www.nytimes.com/2022/10/03/climate/hurricane-ian-rebuilding.html'> building back better after hurricanes</a> and on <a href='https://www.nytimes.com/2022/09/29/climate/coastal-hospitals-hurricane-flooding.html'>hurricanes and hospitals</a>, <b>Newsweek</b> on <a href='https://www.newsweek.com/climate-change-causing-climate-chaos-weather-extreme-events-1739426'>global weirding and climate extremes</a>, on the <a href='https://www.newsweek.com/california-heatwave-ongoing-this-week-electricity-shortages-blackouts-1739826'>2022 California heat waves</a>, on <a href='https://www.newsweek.com/lake-mead-drought-exposes-creepy-long-lost-boat-loaded-artifacts-1728050'>drought impacts on Lake Mead</a> and on <a href='https://www.newsweek.com/north-carolina-lake-disappears-hundreds-fish-suffocate-death-1728238'>fish suffocation in North Carolina's Lake Wilson</a>, and the <b>Independent</b> on the <a href='https://www.independent.co.uk/climate-change/news/pakistan-floods-appeal-melting-glaciers-monsoon-b2157377.html'>2022 Pakistan floods</a>."

- date: <b>July 10th 2022</b>
  summary: "SDS Lab spinout risQ and alumnus Evan Kodra featured in Wall Street Journal; Northeastern news on risQ."
  headline: "The startup risQ, a spinout from our SDS Lab, and alumnus Dr. Evan Kodra (CEO of risQ and a co-founder along with Lab PI Auroop Ganguly and NU alumnus Colin Sullivan), gets <a href='https://www.wsj.com/articles/high-tech-weathermen-forecast-climate-risks-for-bond-markets-11657461236'>featured</a> in the Wall Street Journal. A Northeastern news article about risQ was <a href='https://news.northeastern.edu/2022/01/21/startup-guage-climate-change-risk/'>published</a> on January 21."

- date: <b>June 2nd 2022</b>
  summary: "JGR-Biogeosciences accepts ORNL collaborative paper on carbon cycle extremes (Bharat Sharma, Ganguly, ORNL co-authors)."
  headline: "The Journal of Geophysical Research - Biogeosciences (<a href= 'https://agupubs.onlinelibrary.wiley.com/journal/21698961 ' target= '_blank '>JGR-Biogeosciences</a>) has <a href= 'https://agupubs.onlinelibrary.wiley.com/journal/21698961?tabActivePane=undefined ' target= '_blank '>accepted for publication</a> our collaborative paper with the Oak Ridge National Laboratory. The paper titled ‘Quantifying Carbon Cycle Extremes and Attributing Their Causes Under Climate and Land Use & Land Cover Change from 1850 to 2300’ is led by SDS Lab PhD student Bharat Sharma, and besides Auroop Ganguly, includes the following (ORNL scientists) as co-authors: Jitendra Kumar, Forrest Hoffman, and Nathan Collier. "

- date: <b>June 1st 2022</b>
  summary: "GBRAG Boston area climate report led by Evan Kodra with contributions from Kate Duffy and Lizzy Warner; follows earlier BRAG report."
  headline: "The temperature extremes section of the <a href='https://www.bostonglobe.com/2022/06/01/science/more-heatwaves-rising-seas-intensifying-storms-will-pummel-boston-area-new-report-finds/ ' target= '_blank '>just released</a> Greater Boston Research Advisory Group report (<a href= 'https://www.umb.edu/editor_uploads/images/school_for_environment/GBRAG_report_05312022@1915.pdf' target='_blank'>GBRAG report</a>) on climate assessment of the Boston area was led by former SDS Lab PhD alumnus Evan Kodra with contributions from (then current, now graduated) SDS Lab PhD students Kate Duffy and Mary ('Lizzy') Warner. This follows the <a href= 'https://www.boston.gov/sites/default/files/document-file-12-2016/brag_report_-_final.pdf ' target= '_blank '>original BRAG report</a> where the temperature extremes section was led by Auroop Ganguly with contributions from Evan Kodra and then Northeastern professor Matthias Ruth."

- date: <b>May 26th 2022</b>
  summary: "Thomas Vandal and Kate Duffy awarded NASA SBIR grant to launch Zeus AI for weather and hydrologic analytics."
  headline: "SDS Lab PhD alums and current NASA scientists, <a href='https://www.linkedin.com/in/tjvandal/'>Thomas J. Vandal </a> (CEO and co-founder) and <a href='https://www.linkedin.com/in/katemduffy/' target='_blank'>Kate M. Duffy</a> (CPO and co-founder), have been <a href='https://www.nasa.gov/press-release/nasa-supports-small-business-research-to-power-future-exploration' target='_blank'>awarded</a> a NASA Small Business Innovation Research (SBIR) <a href='https://sbir.nasa.gov/SBIR/abstracts/22/sbir/phase1/SBIR-22-1-S17.04-1586.html' target='_blank'>grant</a> to launch their AI-inspired weather and hydrologic data analytics and forecasting startup <a href='https://myzeus.ai/' target='_blank'>Zeus AI</a> (formerly called GeoLens)."

- date: <b>May 15th 2022</b>
  summary: "NASA selects SDS Lab RAIN (precipitation nowcasting) proposal for water resources funding; team includes TVA, NASA, ORNL, RTI."
  headline: "NASA selects the SDS Lab led 'Category 1' proposal titled 'Remote-sensing data driven Artificial Intelligence for precipitation-Nowcasting (RAIN)' for funding in water resources. The team led by Auroop Ganguly at Northeastern includes the Tennessee Valley Authority, NASA Earth Exchange, Oak Ridge National Laboratory, and RTI International."

- date: <b>May 13th 2022</b>
  summary: "Ganguly co-organizes Fragile Earth 2022 workshop at ACM KDD on AI for climate mitigation, adaptation, and environmental justice."
  headline: "Auroop Ganguly is co-organizing the <a href='https://ai4good.org/fragile-earth-2022/'>Fragile Earth 2022 workshop</a> in conjunction with the <a href='https://www.kdd.org/kdd2022/'>ACM KDD 2022 conference</a>. The focus of the <a href='https://ai4good.org/fragile-earth-2022/'>workshop</a> this year is on 'AI for climate mitigation, adaptation, and environmental justice'. The paper submission deadline is May 26."
  
- date: <b>May 5th 2022</b>
  summary: "Kate Duffy's deep emulation for satellite remote sensing (joint with NASA) published in IEEE TNNLS."
  headline: "A part of Kate Duffy's dissertation research, which focused on Deep Emulation in Satellite Remote Sensing and was joint with NASA (including former SDS Lab PhD alumnus TJ Vandal), is <a href='https://ieeexplore.ieee.org/document/9769745'>now published</a> in IEEE Transactions on Neural Networks and Learning Systems."

- date: <b>April 4th 2022</b>
  summary: "SDS Lab publications cited in all three UN IPCC AR6 reports (physical science, impacts/adaptation, mitigation)."
  headline: "The SDS Lab's publications have been cited in each of the three recent climate reports forming the Sixth Assessment Report (AR6) of the United Nations Intergovernmental Panel on Climate Change (UN IPCC). The reports on the physical science basis (<a href='https://www.ipcc.ch/report/ar6/wg1/'>Report</a>, <a href='https://www.nytimes.com/2021/08/09/climate/climate-change-report-ipcc-un.html'>NYT news</a>); impacts, adaptation, and vulnerability (<a href='https://www.ipcc.ch/report/ar6/wg2/'>Report</a>, <a href='https://www.nytimes.com/2022/02/28/climate/climate-change-ipcc-report.html'>NYT news</a>); and mitigation (<a href='https://www.ipcc.ch/report/ar6/wg3/'>Report</a>, <a href='https://www.nytimes.com/2022/04/04/climate/climate-change-ipcc-un.html'>NYT news</a>) were published in late 2021 to early 2022 timeframe. Please note that the SDS Lab neither participates in the IPCC writing or review processes nor lobbies for citing publications."
 
- date: <b>March 30th 2022</b>
  summary: "Nishant Yadav joins Microsoft Azure AI as senior research scientist; hopes to work with Microsoft AI for Earth."
  headline: "SDS Lab PhD student <a href='https://coe.northeastern.edu/news/experiential-phd-spotlight-with-nishant-yadav/'>Nishant Yadav</a> accepts an offer to join <a href='https://azure.microsoft.com/en-us/overview/'>Microsoft Azure AI</a> as a senior research scientist. In his new role, Nishant hopes to get an opportunity to work with <a href='https://www.microsoft.com/en-us/ai/ai-for-earth'>Microsoft AI for Earth</a>, originally founded and led by <a href='https://www.microsoft.com/en-us/research/people/lujoppa/'>Dr. Lucas Joppa</a>. A prior <a href='https://www.nature.com/articles/d41586-017-08675-7'>comment article</a> in the journal Nature by Dr. Joppa provided a shout-out to an <a href='https://www.kdd.org/awards/view/2017-sigkdd-best-paper-award-winners'>award-winning</a> SDS Lab Climate-AI paper by a former SDS Lab PhD student (and current NASA scientist) <a href='https://scholar.google.com/citations?user=8cLfchMAAAAJ&hl=en'>TJ Vandal</a>." 

- date: <b>February 6th 2022</b>
  summary: "PI Ganguly co-led NAS workshop panel on ML/AI for Earth system science; recording on Vimeo."
  headline: "SDS Lab PI Auroop Ganguly co-led a panel discussion in a <a href='https://www.nationalacademies.org/our-work/machine-learning-and-artificial-intelligence-to-advance-earth-system-science-opportunities-and-challenges---a-workshop'> workshop </a> hosted by the US National Academies of Sciences, Engineering, and Medicine, on February, 2022. The workshop (report under preparation) was titled Machine Learning and Artificial Intelligence to Advance Earth System Science. A recording is available on <a href='https://vimeo.com/677744722'> Vimeo </a> (Ganguly's short talk is from around 1:37:00). Ganguly's previous NAS-hosted presentation was as a keynote speaker in a 2019 Urban Sustainability <a href='https://www.nationalacademies.org/our-work/enhancing-urban-sustainability-infrastructure-a-workshop-on-mathematical-approaches-for-optimizing-investments'> workshop </a> (report <a href='https://nap.nationalacademies.org/read/25480/chapter/1'> here </a>, and <a href='https://vimeo.com/318854857'> Vimeo </a> there: first ~24 minutes)." 

- date: <b>January 24th 2022</b>
  summary: "SDS Lab spinout risQ acquired by Intercontinental Exchange (ICE)."
  headline: "CEE Professor Auroop Ganguly SDS Lab spinout company <a href='https://www.risq.io/'> risQ </a> , a climate modeling and analytics company focused on cities, founded by him and his former PhD students, was <a href='https://news.northeastern.edu/2022/01/21/startup-guage-climate-change-risk/'>acquired by</a> the Fortune 500 company </a> <a href='https://www.ice.com/index'> Intercontinental Exchange </a>."

- date: <b>October 6th 2021</b>
  summary: "Evan Kodra delivers invited keynote on Climate Resilience from Academia to Startup at IIT Bombay."
  headline: "Evan Kodra, SDS Lab alumnus and CEO of climate risk analytics startup <a href='https://www.risq.io/'> risQ </a>, delivers an invited keynote titled <a href='https://www.youtube.com/watch?v=wA7KgAQsiFs'> Climate Resilience from Academia to Startup </a> at the Indian Institute of Technology (IIT) Bombay."

- date: <b>September 24th 2021</b>
  summary: "risQ report on climate and wildfires acknowledged in NBC News video on climate justice."
  headline: "A report on climate change and wildfires by SDS Lab spinout <a href='https://www.risq.io/'> risQ </a> gets acknowledged in an <a href='https://www.youtube.com/watch?v=XcMOyna9ixE'> NBC News video </a> on climate justice."

- date: <b>September 2021</b>
  summary: "Nishant Yadav starts internship with Hitachi AI Labs in Santa Clara."
  headline: "SDS Lab PhD student Nishant Yadav starts an internship with the Hitachi AI Labs in Santa Clara, CA."

- date: <b>July 2021</b>
  summary: "Kate Duffy defends PhD; deep emulation work with NASA; new postdocs Antonia Sohns and Sebastian Ruf."
  headline: "Happy Fourth of July! Kate Duffy defends her PhD dissertation on July 15 at noon Eastern. Link to join the public defense: <a href='https://nam12.safelinks.protection.outlook.com/ap/t-59584e83/?url=https%3A%2F%2Fteams.microsoft.com%2Fl%2Fmeetup-join%2F19%253ameeting_NTA2ZDJiYmYtYWU0Yi00Yjk2LThlZWYtNzEzZWJjMzdkNGY5%2540thread.v2%2F0%3Fcontext%3D%257b%2522Tid%2522%253a%2522a8eec281-aaa3-4dae-ac9b-9a398b9215e7%2522%252c%2522Oid%2522%253a%2522d7aa7111-64f7-4a3b-bb05-28b8dd74960d%2522%257d&data=04%7C01%7Cpal.as%40northeastern.edu%7C6e1ff87f31334dc9fab408d947a624d4%7Ca8eec281aaa34daeac9b9a398b9215e7%7C0%7C0%7C637619601216819072%7CUnknown%7CTWFpbGZsb3d8eyJWIjoiMC4wLjAwMDAiLCJQIjoiV2luMzIiLCJBTiI6Ik1haWwiLCJXVCI6Mn0%3D%7C1000&sdata=csqx1%2BOoloxlCH8vfh8v5WQlfoNFeT7Nwt%2FtTESuuHU%3D&reserved=0'>here</a>. Her work at the intersection of climate-ecology broadly continues the theme of Daiwei Wang's <a href='https://www.nature.com/articles/nature14235'>Nature paper</a>.  Her work on deep emulation for satellite remote sensing is joint with NASA. Welcome Dr. Antonia Sohns and Dr. Sebastian Ruf as Postdoctoral Research Associates. Read their papers on <a href='https://link.springer.com/article/10.1007/s00267-020-01387-1'>participatory modeling</a>  and <a href='https://ieeexplore.ieee.org/abstract/document/8896074'> contagion spread </a>  respectively."

- date: <b>June 2021</b>
  summary: "Poulomi Ganguli's Scientific Reports paper highlighted in E&E News; Stone Chen joins SDS Lab as PhD student."
  headline: "On June 28th, Poulomi Ganguli's <a href='https://www.nature.com/articles/s41598-017-12133-9'>Scientific Reports paper</a>, based on her postdoctoral research at the SDS Lab in the climate-water-energy nexus, is highlighted in an <a href='https://www.eenews.net/stories/1063735943'>E&E News article</a>. On June 1st, Stone Chen has moved back to Boston and will officially join the SDS Lab as a PhD student starting Fall 2021. See his <a href='https://www.nature.com/articles/s41598-020-67088-1'>prior collaborative work</a> with the SDS Lab on physics-guided uncertainty quantification."

- date: <b>May 2021</b>
  summary: "Collaborator Subimal Ghosh receives AGU DL Memorial award; Puja Das and Jack Watson start NASA and PNNL internships."
  headline: "Subimal Ghosh, a professor at the Indian Institute of Technology Bombay and a long time collaborator of the SDS Lab, gets AGU's prestigious <a href='https://eos.org/agu-news/subimal-ghosh-receives-2020-devendra-lal-memorial-medal'>DL Memorial award</a>. Read a Nature Climate Change <a href='https://www.nature.com/articles/nclimate1327'>paper</a> which resulted from Subimal's prior collaboration with the SDS Lab. Doctoral students Puja Das and Jack Watson start internships at NASA's Ames Research Center and US DOE's Pacific Northwest National Laboratory (PNNL) respectively. "

- date: <b>March 21st 2021</b>
  summary: "Shashank Konduri joins NASA Goddard Space Flight Center."
  headline: "Shashank Konduri, PhD student at the SDS Lab, joins NASA's Goddard Space Flight Center (see NU-COE <a href='https://coe.northeastern.edu/news/onto-nasas-goddard-space-flight-center/'>news article</a> ). Read one of Shashank's papers on remote sensing <a href='https://www.sciencedirect.com/science/article/pii/S0034425720304181?via%3Dihub'>here</a>. "

- date: <b>October 21st 2020</b>
  summary: "Ganguly quoted in S&P Global on climate-water-energy nexus for nuclear and fossil plants."
  headline: "Auroop Ganguly is quoted in an <a href='https://www.spglobal.com/marketintelligence/en/news-insights/latest-news-headlines/climate-change-poses-big-water-risks-for-nuclear-fossil-fueled-plants-60669992'>article </a> on the climate-water-energy nexus by S&P Global. "

- date: <b>January 8th 2020</b>
  summary: "risQ emerges from stealth; collaboration with Intercontinental Exchange for climate risk in municipal bonds."
  headline: "Northeastern SDS Lab climate risk analytics spinout <a href='https://www.risq.io/'>risQ</a> emerges from stealth <a href='https://www.businesswire.com/news/home/20200108005592/en/risQ-and-Intercontinental-Exchange-Announce-Collaboration-to-Bring-Climate-Risk-Analytics-to-the-Municipal-Bond-Ecosystem'>(BusinessWire News)</a>. The co-founders include former SDS Lab PhD student Evan Kodra, currently the CEO, and SDS Lab PI Auroop Ganguly, currently the Chief Scientific Adviser. "

