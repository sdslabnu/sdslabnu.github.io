- title: "Network-based restoration strategies maximize ecosystem recovery"
  image: Network based restoration.png
  description: Redressing global patterns of biodiversity loss requires quantitative frameworks that can predict ecosystem collapse and inform restoration strategies. By applying a network-based dynamical approach to synthetic and real-world mutualistic ecosystems, we show that biodiversity recovery following collapse is maximized when extirpated species are reintroduced based solely on their total number of connections in the original interaction network. More complex network-based strategies that prioritize the reintroduction of species that improve ‘higher order’ topological features such as compartmentalization do not provide meaningful performance improvements. These results suggest that it is possible to design nearly optimal restoration strategies that maximize biodiversity recovery for data-poor ecosystems in order to ensure the delivery of critical natural services that fuel economic development, food security, and human health around the globe.
  authors: Udit Bhatia, Sarth Dubey, Tarik C. Gouhier & Auroop R. Ganguly 
  link:
    url: https://www.nature.com/articles/s42003-023-05622-3
    display:  Nature, 2023
  highlight: 1
  news2:

- title: "Intensification and spatial homogenization of coastal upwelling under climate change"
  image: Nature_David_wang.webp
  description: The timing and strength of wind-driven coastal upwelling along the eastern margins of major ocean basins regulate the productivity of critical fisheries and marine ecosystems by bringing deep and nutrient-rich waters to the sunlit surface, where photosynthesis can occur. How coastal upwelling regimes might change in a warming climate is therefore a question of vital importance. Although enhanced land–ocean differential heating due to greenhouse warming has been proposed to intensify coastal upwelling by strengthening alongshore winds, analyses of observations and previous climate models have provided little consensus on historical and projected trends in coastal upwelling. Here we show that there are strong and consistent changes in the timing, intensity and spatial heterogeneity of coastal upwelling in response to future warming in most Eastern Boundary Upwelling Systems (EBUSs). An ensemble of climate models shows that by the end of the twenty-first century the upwelling season will start earlier, end later and become more intense at high but not low latitudes. This projected increase in upwelling intensity and duration at high latitudes will result in a substantial reduction of the existing latitudinal variation in coastal upwelling. These patterns are consistent across three of the four EBUSs (Canary, Benguela and Humboldt, but not California). The lack of upwelling intensification and greater uncertainty associated with the California EBUS may reflect regional controls associated with the atmospheric response to climate change. Given the strong linkages between upwelling and marine ecosystems the projected changes in the intensity, timing and spatial structure of coastal upwelling may influence the geographical distribution of marine biodiversity.
  authors: Daiwei Wang, Tarik C. Gouhier, Bruce A. Menge & Auroop R. Ganguly
  link:
    url: https://doi.org/10.1038/nature14235
    display:  Nature, 2015
  highlight: 1
  news2:
  
- title: "DeepSD: Generating High Resolution Climate Change Projections through Single Image Super-Resolution"
  image: Vandal17.PNG
  description: The impacts of climate change are felt by most critical systems, such as infrastructure, ecological systems, and power-plants. However,contemporary Earth System Models (ESM) are run at spatial resolutions too coarse for assessing effects this localized. Local scale projections can be obtained using statistical downscaling, a technique which uses historical climate observations to learn a low-resolution to high-resolution mapping. Depending on statistical modeling choices, downscaled projections have been shown to vary significantly terms of accuracy and reliability. The spatio-temporal nature of the climate system motivates the adaptation of super-resolution image processing techniques to statistical downscaling. In our work, we present DeepSD, a generalized stacked super resolution convolutional neural network (SRCNN) framework for statistical downscaling of climate variables. DeepSD augments SRCNN with multi-scale input channels to maximize predictability in statistical downscaling. We provide a comparison with Bias Correction Spatial Disaggregation as well as three Automated-Statistical Downscaling approaches in downscaling daily precipitation from 1 degree ( 100km) to 1/8 degrees ( 12.5km) over the Continental United States.Furthermore, a framework using the NASA Earth Exchange (NEX) platform is discussed for downscaling more than 20 ESM models with multiple emission scenarios.
  authors: Thomas Vandal, Evan Kodra, Sangram Ganguly, Andrew Michaelis, Ramakrishna Nemani, Auroop R Ganguly
  link:
    url: https://doi.org/10.1145/3097983.3098004
    display:  ACM, 2017
  highlight: 1
