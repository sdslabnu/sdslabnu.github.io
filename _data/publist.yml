- title: "Lack of uniform trends but increasing spatial variability in observed Indian rainfall extremes"
  image: Nature_Climate_Change.webp
  description: Recent studies disagree on how rainfall extremes over India have changed in space and time over the past half century as well as on whether the changes observed are due to global warming or regional urbanization7. Although a uniform and consistent decrease in moderate rainfall has been reported a lack of agreement about trends in heavy rainfall may be due in part to differences in the characterization and spatial averaging of extremes. Here we use extreme value theory to examine trends in Indian rainfall over the past half century in the context of long-term, low-frequency variability. We show that when generalized extreme value theory is applied to annual maximum rainfall over India, no statistically significant spatially uniform trends are observed, in agreement with previous studies using different approaches. Furthermore, our space–time regression analysis of the return levels points to increasing spatial variability of rainfall extremes over India. Our findings highlight the need for systematic examination of global versus regional drivers of trends in Indian rainfall extremes, and may help to inform flood hazard preparedness and water resource management in the region.
  authors: Subimal Ghosh, Debasish Das, Shih-Chieh Kao , Auroop R. Ganguly
  link:
    url: https://doi.org/10.1038/nclimate1327
    display:  Nature Climate Change, 2011
  highlight: 1

- title: "Resilience of Urban Transport Network-of-Networks under Intense Flood Hazards Exacerbated by Targeted Attacks"
  image: NON.webp
  description: Natural hazards including floods can trigger catastrophic failures in interdependent urban transport network-of-networks (NoNs). Population growth has enhanced transportation demand while urbanization and climate change have intensified urban floods. However, despite the clear need to develop actionable insights for improving the resilience of critical urban lifelines, the theory and methods remain underdeveloped. Furthermore, as infrastructure systems become more intelligent, security experts point to the growing threat of targeted cyber-physical attacks during natural hazards. Here we develop a hypothesis-driven resilience framework for urban transport NoNs, which we demonstrate on the London Rail Network (LRN). We find that topological attributes designed for maximizing efficiency rather than robustness render the network more vulnerable to compound natural-targeted disruptions including cascading failures. Our results suggest that an organizing principle for post-disruption recovery may be developed with network science principles. Our findings and frameworks can generalize to urban lifelines and more generally to real-world spatial networks.
  authors: Nishant Yadav, Samrat Chatterjee , Auroop R. Ganguly
  link:
    url: https://doi.org/10.1038/s41598-020-66049-y
    display: Nature Climate Change, 2011
  highlight: 1
